<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Account — SmartMenuKJ</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#f1f0ee" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preload" href="fonts/handjet-dot.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="css/style.css?v=20260928" />
<script>(function(d){d.documentElement.classList.add("js");try{var t=localStorage.getItem("smkj_theme");if(t==="dark"||t==="light")d.documentElement.setAttribute("data-theme",t)}catch(e){}})(document);</script>
</head>
<body>

<a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to content</a>
<header id="site-header" class="site-header" data-active="account.html" data-hide-mobile-cta></header>

<main id="main">
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow" data-i18n="acct.eyebrow">Your account</p>
      <h1 class="h-lg" data-i18n="acct.title">Account</h1>
    </div>
  </section>

  <section class="svc section-last">
    <div class="container">
      <div id="accountGuard" class="card empty-state hidden">
        <h2 class="h-md" data-i18n="acct.guard.title">You need to sign in first.</h2>
        <p data-i18n="acct.guard.desc">Log in or create an account to view your requests.</p>
        <a href="login.html?next=account.html" class="btn btn-primary" data-i18n="nav.login">Log in</a>
      </div>

      <div id="accountContent" class="hidden">
        <div class="grid grid-2" style="align-items:start; margin-bottom:16px;">
          <div class="card form-card">
            <h2 data-i18n="acct.profile.title">Profile</h2>
            <form id="profileForm">
              <div class="field">
                <label for="acctName" data-i18n="contact.form.name">Full name</label>
                <input id="acctName" type="text" autocomplete="name" />
              </div>
              <div class="field">
                <label data-i18n="contact.form.email">Email</label>
                <div id="acctEmail" class="readonly"></div>
              </div>
              <button type="submit" class="btn btn-primary" data-i18n="acct.profile.save">Save changes</button>
              <div id="profileNote" class="form-note" role="status" aria-live="polite"></div>
            </form>
          </div>
          <div class="card form-card">
            <h2 data-i18n="acct.summary.title">Summary</h2>
            <p class="eyebrow" data-i18n="acct.member.since">Member since</p>
            <p id="acctSince" class="summary-big">—</p>
          </div>
        </div>

        <div class="panel-head" style="margin-top:40px;"><h3 data-i18n="acct.leads.title">Your requests</h3></div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th data-i18n="acct.th.date">Date</th>
              <th data-i18n="acct.th.service">Service</th>
              <th data-i18n="acct.th.message">Message</th>
              <th data-i18n="acct.th.status">Status</th>
            </tr></thead>
            <tbody id="leadsList"></tbody>
          </table>
        </div>
        <div id="leadsEmpty" class="empty-state hidden">
          <p data-i18n="acct.leads.empty">No requests yet.</p>
          <a href="contact.html#quote" class="btn btn-ghost btn-sm" data-i18n="ctaband.cta1">Start a project</a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer invert"></footer>

<script type="module">
  import { mountChrome } from "./js/chrome.js?v=20260928";
  import { registerDict, applyI18n, initLangSwitch } from "./js/i18n.js?v=20260928";
  import { initCookieBanner } from "./js/cookies.js?v=20260928";

  registerDict({
    en: {
      "acct.eyebrow": "Your account", "acct.title": "Account",
      "acct.guard.title": "You need to sign in first.", "acct.guard.desc": "Log in or create an account to view your requests.",
      "acct.profile.title": "Profile", "acct.profile.save": "Save changes", "acct.profile.saved": "Saved.",
      "acct.summary.title": "Summary", "acct.member.since": "Member since",
      "acct.leads.title": "Your requests", "acct.th.date": "Date", "acct.th.service": "Service", "acct.th.message": "Message", "acct.th.status": "Status",
      "acct.leads.empty": "No requests yet.",
      "status.new": "New", "status.progress": "In progress", "status.done": "Completed",
      "contact.form.svc.general": "General inquiry",
    },
    bg: {
      "acct.eyebrow": "Вашият профил", "acct.title": "Профил",
      "acct.guard.title": "Трябва да влезете първо.", "acct.guard.desc": "Влезте или се регистрирайте, за да видите заявките си.",
      "acct.profile.title": "Профил", "acct.profile.save": "Запази промените", "acct.profile.saved": "Запазено.",
      "acct.summary.title": "Обобщение", "acct.member.since": "Член от",
      "acct.leads.title": "Вашите заявки", "acct.th.date": "Дата", "acct.th.service": "Услуга", "acct.th.message": "Съобщение", "acct.th.status": "Статус",
      "acct.leads.empty": "Все още няма заявки.",
      "status.new": "Нова", "status.progress": "В процес", "status.done": "Завършена",
      "contact.form.svc.general": "Общо запитване",
    },
  });

  mountChrome();
  applyI18n();
  initLangSwitch();
  initCookieBanner();
</script>
<script type="module" src="js/account.js?v=20260928"></script>
</body>
</html>
