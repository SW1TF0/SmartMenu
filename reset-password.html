<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Reset password — SmartMenuKJ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%2305070d'/%3E%3Cpath d='M54 12 26 56h18l-6 32 32-46H50z' fill='%2338bdf8'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],display:['Montserrat','sans-serif']},colors:{ink:{950:'#05070d'},web:{DEFAULT:'#38bdf8',glow:'#0ea5e9'},menu:{DEFAULT:'#fb923c'}}}}};</script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-ink-950 text-slate-200 font-sans antialiased min-h-screen">
  <div class="admin-bg" aria-hidden="true"></div>

  <header class="admin-topbar">
    <a href="index.html" class="flex items-center gap-3" aria-label="SmartMenuKJ home">
      <span class="logo-mark"><i class="fa-solid fa-bolt"></i></span>
      <span class="font-display font-extrabold tracking-tight text-white text-lg">Smart<span class="text-web">Menu</span><span class="text-menu">KJ</span></span>
    </a>
    <button id="lang-toggle" class="lang-toggle" aria-label="Switch language">
      <span data-lang="en" class="lang-opt is-active">EN</span><span class="lang-sep">/</span><span data-lang="bg" class="lang-opt">BG</span>
    </button>
  </header>

  <main class="admin-login">
    <div class="admin-login-card">
      <span class="logo-mark logo-mark--lg mx-auto"><i class="fa-solid fa-key"></i></span>
      <h1 class="admin-login-title" data-i18n data-en="Set a new password" data-bg="Задайте нова парола">Set a new password</h1>
      <p class="admin-login-sub" data-i18n data-en="Choose a new password for your SmartMenuKJ account." data-bg="Изберете нова парола за вашия акаунт в SmartMenuKJ.">Choose a new password for your SmartMenuKJ account.</p>

      <form id="reset-form" novalidate>
        <div class="field">
          <label data-i18n data-en="New password" data-bg="Нова парола">New password</label>
          <div class="input-icon"><i class="fa-solid fa-lock"></i><input type="password" id="rp-pass" required minlength="6" placeholder="••••••••" /><button type="button" class="pw-toggle" aria-label="Show password"><i class="fa-solid fa-eye"></i></button></div>
        </div>
        <div class="field mt-4">
          <label data-i18n data-en="Confirm new password" data-bg="Потвърдете новата парола">Confirm new password</label>
          <div class="input-icon"><i class="fa-solid fa-lock"></i><input type="password" id="rp-confirm" required minlength="6" placeholder="••••••••" /></div>
        </div>
        <p class="auth-error" id="rp-msg" hidden><i class="fa-solid fa-circle-exclamation"></i> <span></span></p>
        <button type="submit" class="btn-primary btn-lg w-full justify-center mt-5"><span data-i18n data-en="Update password" data-bg="Обнови паролата">Update password</span></button>
      </form>

      <div id="rp-done" class="auth-success" hidden style="margin-top:0">
        <i class="fa-solid fa-circle-check"></i>
        <p data-i18n data-en="Your password has been updated. You can now sign in." data-bg="Паролата ви е обновена. Вече можете да влезете.">Your password has been updated. You can now sign in.</p>
        <a href="index.html" class="btn-primary btn-lg mt-4 inline-flex" data-i18n data-en="Go to sign in" data-bg="Към вход">Go to sign in</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    (function () {
      var CFG = window.SMKJ_CONFIG || {};
      var norm = function (u) { return String(u || '').trim().replace(/\/+$/, '').replace(/\/(rest|auth)\/v1$/i, '').replace(/\/+$/, ''); };
      var sb = null;
      if (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient) {
        try { sb = window.supabase.createClient(norm(CFG.SUPABASE_URL), CFG.SUPABASE_ANON_KEY); } catch (e) {}
      }

      /* bilingual */
      var lang = localStorage.getItem('smkj-lang') || 'en';
      function applyLang() {
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(function (el) { var v = el.getAttribute('data-' + lang); if (v !== null) el.textContent = v; });
        document.querySelectorAll('.lang-opt').forEach(function (o) { o.classList.toggle('is-active', o.getAttribute('data-lang') === lang); });
      }
      var lt = document.getElementById('lang-toggle');
      if (lt) lt.addEventListener('click', function () { lang = lang === 'en' ? 'bg' : 'en'; localStorage.setItem('smkj-lang', lang); applyLang(); });
      document.querySelectorAll('.lang-opt').forEach(function (o) { o.addEventListener('click', function (e) { e.stopPropagation(); lang = o.getAttribute('data-lang'); localStorage.setItem('smkj-lang', lang); applyLang(); }); });
      applyLang();

      /* password visibility */
      document.querySelectorAll('.pw-toggle').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var input = btn.parentElement.querySelector('input'); var icon = btn.querySelector('i');
          if (input.type === 'password') { input.type = 'text'; icon.className = 'fa-solid fa-eye-slash'; }
          else { input.type = 'password'; icon.className = 'fa-solid fa-eye'; }
        });
      });

      var msgEl = document.getElementById('rp-msg');
      var msgText = msgEl.querySelector('span');
      function msg(text, info) { msgText.textContent = text; msgEl.hidden = false; msgEl.classList.toggle('is-info', !!info); }
      var T = {
        nosb: { en: 'Password reset is unavailable here. Please contact krasimiruzun@smartmenukj.com.', bg: 'Нулирането не е достъпно тук. Пишете на krasimiruzun@smartmenukj.com.' },
        short: { en: 'Password must be at least 6 characters.', bg: 'Паролата трябва да е поне 6 символа.' },
        mismatch: { en: 'Passwords do not match.', bg: 'Паролите не съвпадат.' },
        expired: { en: 'This reset link is invalid or has expired. Please request a new one from the sign-in window.', bg: 'Връзката е невалидна или изтекла. Заявете нова от прозореца за вход.' }
      };
      var tr = function (k) { return T[k][lang] || T[k].en; };

      var recoveryReady = false;
      if (sb) { sb.auth.onAuthStateChange(function (event) { if (event === 'PASSWORD_RECOVERY') recoveryReady = true; }); }

      document.getElementById('reset-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        msgEl.hidden = true; msgEl.classList.remove('is-info');
        if (!sb) { msg(tr('nosb'), true); return; }
        var pass = document.getElementById('rp-pass').value;
        var confirm = document.getElementById('rp-confirm').value;
        if (pass.length < 6) { msg(tr('short'), false); return; }
        if (pass !== confirm) { msg(tr('mismatch'), false); return; }
        var btn = e.target.querySelector('button[type="submit"]'); btn.disabled = true; btn.classList.add('is-loading');
        try {
          var r = await sb.auth.updateUser({ password: pass });
          if (r.error) { msg(tr('expired'), false); return; }
          document.getElementById('reset-form').style.display = 'none';
          document.getElementById('rp-done').hidden = false;
        } catch (err) {
          msg(tr('expired'), false);
        } finally { btn.disabled = false; btn.classList.remove('is-loading'); }
      });
    })();
  </script>
</body>
</html>
