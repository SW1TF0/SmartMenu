name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-bg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Bulgarian pages
        run: node tools/build-bg.mjs

      - name: Committed bg/ is up to date
        run: |
          if [ -n "$(git status --porcelain -- bg)" ]; then
            git status --short -- bg
            echo "::error::bg/ is out of date. Run 'node tools/build-bg.mjs' and commit bg/."
            exit 1
          fi
