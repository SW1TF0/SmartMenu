name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-langs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Bulgarian and Turkish pages
        run: node tools/build-langs.mjs

      - name: Committed bg/ and tr/ are up to date
        run: |
          if [ -n "$(git status --porcelain -- bg tr)" ]; then
            git status --short -- bg tr
            echo "::error::bg/ or tr/ is out of date. Run 'node tools/build-langs.mjs' and commit bg/ and tr/."
            exit 1
          fi
