<body>

<a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to content</a>
<header id="site-header" class="site-header" data-active="account.html" data-hide-mobile-cta></header>

<main id="main">
  <section class="page-hero">
    <div class="container">
      <p class="eyebrow" data-i18n="acct.eyebrow">Your account</p>
      <h1 class="h-lg" data-i18n="acct.title">Account</h1>
    </div>
  </section>

  <section class="svc section-last">
    <div class="container">
      <div id="accountGuard" class="card empty-state hidden">
        <h2 class="h-md" data-i18n="acct.guard.title">You need to sign in first.</h2>
        <p data-i18n="acct.guard.desc">Log in or create an account to view your requests.</p>
        <a href="login.html?next=account.html" class="btn btn-primary" data-i18n="nav.login">Log in</a>
      </div>

      <div id="accountContent" class="hidden">
        <div class="grid grid-2" style="align-items:start; margin-bottom:16px;">
          <div class="card form-card">
            <h2 data-i18n="acct.profile.title">Profile</h2>
            <form id="profileForm">
              <div class="field">
                <label for="acctName" data-i18n="contact.form.name">Full name</label>
                <input id="acctName" type="text" autocomplete="name" />
              </div>
              <div class="field">
                <label data-i18n="contact.form.email">Email</label>
                <div id="acctEmail" class="readonly"></div>
              </div>
              <button type="submit" class="btn btn-primary" data-i18n="acct.profile.save">Save changes</button>
              <div id="profileNote" class="form-note" role="status" aria-live="polite"></div>
            </form>
          </div>
          <div class="card form-card">
            <h2 data-i18n="acct.summary.title">Summary</h2>
            <p class="eyebrow" data-i18n="acct.member.since">Member since</p>
            <p id="acctSince" class="summary-big">—</p>
          </div>
        </div>

        <div class="panel-head" style="margin-top:40px;"><h3 data-i18n="acct.leads.title">Your requests</h3></div>
        <div class="table-wrap">
          <table>
            <thead><tr>
              <th data-i18n="acct.th.date">Date</th>
              <th data-i18n="acct.th.service">Service</th>
              <th data-i18n="acct.th.message">Message</th>
              <th data-i18n="acct.th.status">Status</th>
            </tr></thead>
            <tbody id="leadsList"></tbody>
          </table>
        </div>
        <div id="leadsEmpty" class="empty-state hidden">
          <p data-i18n="acct.leads.empty">No requests yet.</p>
          <a href="contact.html#quote" class="btn btn-ghost btn-sm" data-i18n="ctaband.cta1">Start a project</a>
        </div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer" class="site-footer"></footer>
