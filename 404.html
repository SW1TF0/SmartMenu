<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>404 — SmartMenuKJ</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Inter', system-ui, sans-serif; color: #e2e8f0; text-align: center; padding: 2rem;
      background:
        radial-gradient(120% 80% at 50% -10%, #0a1626 0%, transparent 60%),
        linear-gradient(180deg, #080b14, #05070d);
      overflow: hidden;
    }
    .wrap { position: relative; z-index: 1; max-width: 560px; }
    .orb { position: fixed; border-radius: 50%; filter: blur(90px); z-index: 0; }
    .orb.a { width: 40vw; height: 40vw; top: -10vw; left: -8vw; background: rgba(56,189,248,0.25); }
    .orb.b { width: 36vw; height: 36vw; bottom: -12vw; right: -6vw; background: rgba(251,146,60,0.18); }
    .code {
      font-family: 'Montserrat', sans-serif; font-weight: 900; line-height: 1;
      font-size: clamp(5rem, 20vw, 11rem); letter-spacing: -0.04em;
      background: linear-gradient(110deg, #38bdf8, #34d399 40%, #fbbf24 70%, #fb923c);
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    h1 { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: clamp(1.3rem, 4vw, 2rem); color: #fff; margin-top: 0.5rem; }
    p { color: #94a3b8; margin-top: 0.9rem; line-height: 1.6; }
    a.home {
      display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 2rem;
      padding: 0.85rem 1.6rem; border-radius: 13px; font-weight: 600; text-decoration: none; color: #04121f;
      background: linear-gradient(135deg, #38bdf8, #0ea5e9);
      box-shadow: 0 12px 30px -10px rgba(14,165,233,0.6);
      transition: transform 0.25s ease;
    }
    a.home:hover { transform: translateY(-2px); }
    .brand { margin-top: 2.4rem; font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; color: #475569; }
  </style>
</head>
<body>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="wrap">
    <div class="code">404</div>
    <h1>This page took a wrong turn.</h1>
    <p>The page you're looking for doesn't exist or has moved. Let's get you back to engineering the future.</p>
    <a class="home" href="/">&#8592;&nbsp; Back to home</a>
    <div class="brand">SmartMenuKJ</div>
  </div>
</body>
</html>
