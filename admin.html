<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Админ — SmartMenuKJ</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#ffffff" />
<link rel="icon" href="/favicon.ico?v=3" sizes="48x48" />
<link rel="icon" href="/favicon.svg?v=3" type="image/svg+xml" />
<link rel="icon" href="/favicon-32x32.png?v=3" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
<link rel="manifest" href="/site.webmanifest" />
<!-- Before any stylesheet: theme, audience (Home / Business) and the redirect to the visitor's language, so nothing flashes or loads twice. -->
<script>(function(d,w){var h=d.documentElement,n=w.navigator||{};h.classList.add("js");function g(k){try{return w.localStorage.getItem(k)}catch(e){return null}}function s(k,v){try{w.localStorage.setItem(k,v)}catch(e){}}var t=g("smkj_theme");if(t==="dark"||t==="light")h.setAttribute("data-theme",t);var A={},L=d.querySelectorAll('link[rel="alternate"][hreflang]');for(var i=0;i<L.length;i++)A[L[i].getAttribute("hreflang")]=L[i].href;if(A.bg&&!/bot|crawl|spider|slurp|lighthouse/i.test(n.userAgent||"")){var p=h.getAttribute("lang");if(p!=="bg"&&p!=="tr")p="en";var l=g("smkj_lang");if(l!=="en"&&l!=="bg"&&l!=="tr")l=null;var o=l||(p==="en"?((n.language||"").toLowerCase().indexOf("tr")===0?"tr":"bg"):p);if(o!==p&&A[o]){var u=new URL(A[o],location.href);location.replace(u.pathname+location.search+location.hash);return}}var a=null;try{a=new URLSearchParams(location.search).get("for")}catch(e){}if(a==="personal"||a==="business")s("smkj_audience",a);else a=g("smkj_audience");if(a!=="personal")a="business";h.setAttribute("data-audience",a);if(a==="personal"&&h.hasAttribute("data-aud-page")){h.classList.add("aud-pending");setTimeout(function(){h.classList.remove("aud-pending")},1500)}})(document,window);</script>
<link rel="preload" href="fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="css/style.css?v=20261112g" />
<link rel="stylesheet" href="css/admin.css?v=20261112g" />
<link rel="modulepreload" href="js/i18n.js?v=20261112g" />
<link rel="modulepreload" href="js/chrome.js?v=20261112g" />
<link rel="modulepreload" href="js/motion.js?v=20261112g" />
</head>
<body>

<a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to content</a>
<header id="site-header" class="site-header" data-active="admin.html" data-hide-mobile-cta></header>

<main id="main" class="adm">
  <section class="adm-top">
    <div class="container">
      <div class="adm-head">
        <div>
          <p class="eyebrow live" data-i18n="adm.eyebrow">Admin</p>
          <h1 class="adm-title" data-i18n="adm.title">Dashboard</h1>
          <p id="admWho" class="adm-who hidden"></p>
        </div>
        <div id="admHeadActions" class="adm-head-actions hidden">
          <span id="admUpdated" class="adm-updated" aria-live="polite"></span>
          <button type="button" id="admRefresh" class="adm-icon-btn" data-i18n-aria="adm.refresh" aria-label="Refresh" title="Refresh">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>
  </section>

  <section class="section-last">
    <div class="container">
      <div id="adminLoading" class="adm-loading" role="status">
        <span class="spinner" aria-hidden="true"></span><span data-i18n="adm.loading">Loading…</span>
      </div>

      <div id="adminGuard" class="card empty-state hidden">
        <h2 class="h-md" data-i18n="adm.guard.title">Admins only</h2>
        <p data-i18n="adm.guard.desc">Sign in with an admin account to view this page.</p>
        <a href="login.html?next=admin.html" class="btn btn-primary" data-i18n="nav.login">Log in</a>
      </div>

      <div id="adminContent" class="hidden">
        <div class="adm-stats">
          <button type="button" class="adm-stat is-new" data-stat-filter="new">
            <span class="adm-stat-label"><i class="dot dot-new"></i><span data-i18n="adm.stat.new">New</span></span>
            <b id="statNewLeads">–</b>
            <span class="adm-stat-hint" data-i18n="adm.stat.newHint">waiting for a reply</span>
          </button>
          <button type="button" class="adm-stat" data-stat-filter="progress">
            <span class="adm-stat-label"><i class="dot dot-progress"></i><span data-i18n="adm.stat.progress">In progress</span></span>
            <b id="statProgress">–</b>
            <span class="adm-stat-hint" data-i18n="adm.stat.progressHint">being handled</span>
          </button>
          <button type="button" class="adm-stat" data-stat-filter="week">
            <span class="adm-stat-label" data-i18n="adm.stat.week">Last 7 days</span>
            <b id="statWeek">–</b>
            <span class="adm-stat-hint" data-i18n="adm.stat.weekHint">new requests</span>
          </button>
          <button type="button" class="adm-stat" data-stat-filter="all">
            <span class="adm-stat-label" data-i18n="adm.stat.total">All requests</span>
            <b id="statTotalLeads">–</b>
            <span class="adm-stat-hint"><span id="statUsers">–</span> <span data-i18n="adm.stat.usersHint">registered users</span></span>
          </button>
        </div>

        <div class="adm-tabs" role="tablist" data-i18n-aria="adm.title" aria-label="Dashboard">
          <button type="button" class="adm-tab active" role="tab" id="tabBtnLeads" aria-selected="true" aria-controls="tabLeads" data-tab="tabLeads">
            <span data-i18n="adm.tab.leads">Requests</span><span class="adm-count" id="countLeads">0</span>
          </button>
          <button type="button" class="adm-tab" role="tab" id="tabBtnUsers" aria-selected="false" aria-controls="tabUsers" data-tab="tabUsers" tabindex="-1">
            <span data-i18n="adm.tab.users">Users</span><span class="adm-count" id="countUsers">0</span>
          </button>
        </div>

        <div id="tabLeads" class="adm-panel active" role="tabpanel" aria-labelledby="tabBtnLeads">
          <section id="admAttention" class="adm-attention hidden" aria-labelledby="attTitle">
            <header class="adm-att-head">
              <h2 id="attTitle"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l9 16H3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M12 10v4.2M12 17h.01" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg><span data-i18n="adm.att.title">Needs attention</span></h2>
              <span id="attCount" class="adm-count"></span>
            </header>
            <ul id="attList" class="adm-att-list" role="list"></ul>
          </section>

          <div id="admOverview" class="adm-overview hidden">
            <figure class="adm-chart">
              <figcaption><span data-i18n="adm.chart.weeks">Requests per week</span><span class="adm-chart-sub" data-i18n="adm.chart.weeksSub">last 12 weeks</span></figcaption>
              <div id="chartWeeks" class="adm-weeks" role="img"></div>
              <div id="chartWeeksAxis" class="adm-weeks-axis" aria-hidden="true"></div>
            </figure>
            <figure class="adm-chart">
              <figcaption><span data-i18n="adm.chart.services">By service</span><span class="adm-chart-sub" data-i18n="adm.chart.servicesSub">click to filter</span></figcaption>
              <div id="chartServices" class="adm-bars"></div>
            </figure>
          </div>

          <div class="adm-toolbar">
            <label class="adm-search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <input id="leadSearch" type="search" autocomplete="off" data-i18n-ph="adm.search.leads" placeholder="Search name, phone, email…" data-i18n-aria="adm.search.leads" aria-label="Search" />
              <kbd class="adm-kbd" aria-hidden="true">/</kbd>
            </label>
            <div class="adm-chips" role="group" data-i18n-aria="adm.filter.status" aria-label="Status">
              <button type="button" class="adm-chip active" data-status="all" aria-pressed="true"><span data-i18n="adm.filter.all">All</span> <span class="adm-chip-n" data-n="all"></span></button>
              <button type="button" class="adm-chip" data-status="new" aria-pressed="false"><i class="dot dot-new"></i><span data-i18n="status.new">New</span> <span class="adm-chip-n" data-n="new"></span></button>
              <button type="button" class="adm-chip" data-status="progress" aria-pressed="false"><i class="dot dot-progress"></i><span data-i18n="status.progress">In progress</span> <span class="adm-chip-n" data-n="progress"></span></button>
              <button type="button" class="adm-chip" data-status="done" aria-pressed="false"><i class="dot dot-done"></i><span data-i18n="status.done">Done</span> <span class="adm-chip-n" data-n="done"></span></button>
            </div>
            <div class="adm-toolbar-end">
              <div class="adm-view" role="group" data-i18n-aria="adm.view" aria-label="View">
                <button type="button" data-view="list" aria-pressed="true" data-i18n-aria="adm.view.list" aria-label="List" title="List">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
                </button>
                <button type="button" data-view="board" aria-pressed="false" data-i18n-aria="adm.view.board" aria-label="Board" title="Board">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="4.5" width="5" height="15" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="9.5" y="4.5" width="5" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="15.5" y="4.5" width="5" height="12.5" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
                </button>
              </div>
              <select id="leadSort" class="adm-select" data-i18n-aria="adm.sort" aria-label="Sort">
                <option value="new" data-i18n="adm.sort.new">Newest first</option>
                <option value="old" data-i18n="adm.sort.old">Oldest first</option>
              </select>
              <select id="leadType" class="adm-select" data-i18n-aria="adm.filter.type" aria-label="Type">
                <option value="all" data-i18n="adm.filter.allTypes">All types</option>
                <option value="personal" data-i18n="adm.type.personal">Home</option>
                <option value="business" data-i18n="adm.type.business">Business</option>
              </select>
              <button type="button" id="exportCsv" class="adm-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span data-i18n="adm.export">Export CSV</span>
              </button>
            </div>
          </div>

          <p id="leadsSummary" class="adm-summary" aria-live="polite"></p>
          <ul id="leadsList" class="adm-list" role="list"></ul>
          <div id="leadsBoard" class="adm-board" hidden></div>
          <div id="leadsEmpty" class="adm-empty hidden"></div>

          <div id="bulkBar" class="adm-bulk" role="region" data-i18n-aria="adm.bulk.region" aria-label="Selected requests" hidden>
            <span id="bulkCount" class="adm-bulk-count"></span>
            <div class="adm-bulk-actions">
              <button type="button" class="adm-bulk-btn" data-bulk-status="new"><i class="dot dot-new"></i><span data-i18n="status.new">New</span></button>
              <button type="button" class="adm-bulk-btn" data-bulk-status="progress"><i class="dot dot-progress"></i><span data-i18n="status.progress">In progress</span></button>
              <button type="button" class="adm-bulk-btn" data-bulk-status="done"><i class="dot dot-done"></i><span data-i18n="status.done">Done</span></button>
              <button type="button" class="adm-bulk-btn adm-bulk-danger" id="bulkDelete" data-i18n="adm.delete">Delete</button>
            </div>
            <button type="button" class="adm-bulk-x" id="bulkClear" data-i18n-aria="adm.bulk.clear" aria-label="Clear selection">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>

        <div id="tabUsers" class="adm-panel" role="tabpanel" aria-labelledby="tabBtnUsers" hidden>
          <div class="adm-toolbar">
            <label class="adm-search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 16l4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              <input id="userSearch" type="search" autocomplete="off" data-i18n-ph="adm.search.users" placeholder="Search name or email…" data-i18n-aria="adm.search.users" aria-label="Search" />
            </label>
            <div class="adm-toolbar-end">
              <button type="button" id="exportUsers" class="adm-btn">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11m0 0l-4.5-4.5M12 15l4.5-4.5M5 19h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
                <span data-i18n="adm.export">Export CSV</span>
              </button>
            </div>
          </div>
          <p id="usersSummary" class="adm-summary" aria-live="polite"></p>
          <ul id="usersList" class="adm-list adm-users" role="list"></ul>
          <div id="usersEmpty" class="adm-empty hidden"></div>
        </div>
      </div>
    </div>
  </section>

  <dialog id="leadDialog" class="adm-dialog" aria-labelledby="dlgName">
    <div class="adm-dialog-inner">
      <header class="adm-dialog-head">
        <div>
          <p id="dlgMeta" class="adm-dialog-meta"></p>
          <h2 id="dlgName" class="adm-dialog-title"></h2>
          <p id="dlgCompany" class="adm-dialog-company"></p>
        </div>
        <div class="adm-dialog-nav">
          <span id="dlgPos" class="adm-dialog-pos"></span>
          <button type="button" class="adm-icon-btn adm-icon-sm" id="dlgPrev" data-i18n-aria="adm.prev" aria-label="Previous" title="←">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="adm-icon-btn adm-icon-sm" id="dlgNext" data-i18n-aria="adm.next" aria-label="Next" title="→">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button type="button" class="adm-icon-btn adm-icon-sm" data-close data-i18n-aria="adm.close" aria-label="Close">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
      </header>
      <div id="dlgContact" class="adm-dialog-contact"></div>
      <div id="dlgReply" class="adm-reply"></div>
      <div class="adm-dialog-section">
        <p class="adm-dialog-label" data-i18n="adm.th.message">Message</p>
        <p id="dlgMessage" class="adm-dialog-message"></p>
      </div>
      <div class="adm-dialog-section">
        <label class="adm-dialog-label" for="dlgNote"><span data-i18n="adm.note">Internal note</span> <span class="adm-note-hint" data-i18n="adm.note.hint">only admins see this</span></label>
        <textarea id="dlgNote" class="adm-note" rows="3" data-i18n-ph="adm.note.ph" placeholder="E.g. called on Monday, visit on Thursday at 10:00…"></textarea>
        <p id="dlgNoteState" class="adm-note-state" aria-live="polite"></p>
      </div>
      <div class="adm-dialog-section">
        <p class="adm-dialog-label"><span data-i18n="adm.remind">Reminder</span> <span class="adm-note-hint" data-i18n="adm.remind.hint">shows under “Needs attention” on that day</span></p>
        <div class="adm-remind">
          <input id="dlgRemind" type="date" class="adm-date" data-i18n-aria="adm.remind" aria-label="Reminder" />
          <button type="button" class="adm-btn" data-remind="1" data-i18n="adm.remind.tomorrow">Tomorrow</button>
          <button type="button" class="adm-btn" data-remind="3" data-i18n="adm.remind.3days">In 3 days</button>
          <button type="button" class="adm-btn" data-remind="7" data-i18n="adm.remind.week">In a week</button>
          <button type="button" class="adm-btn adm-btn-quiet" data-remind="0" id="dlgRemindClear" data-i18n="adm.remind.clear">Clear</button>
        </div>
      </div>
      <div class="adm-dialog-section">
        <p class="adm-dialog-label"><span data-i18n="adm.th.status">Status</span> <span class="adm-note-hint adm-kbd-hint" data-i18n="adm.status.keys">keys 1 · 2 · 3</span></p>
        <div id="dlgStatus" class="adm-status-seg" role="group" data-i18n-aria="adm.th.status" aria-label="Status"></div>
      </div>
      <footer class="adm-dialog-foot">
        <button type="button" id="dlgDelete" class="adm-btn adm-btn-danger" data-i18n="adm.delete">Delete</button>
        <button type="button" class="btn btn-primary btn-sm" data-close data-i18n="adm.close">Close</button>
      </footer>
    </div>
  </dialog>

  <div id="admToast" class="adm-toast" role="status" aria-live="polite"></div>
</main>

<footer id="site-footer" class="site-footer"></footer>

<script type="module">
  import { mountChrome } from "./js/chrome.js?v=20261112g";
  import { applyI18n, initLangSwitch } from "./js/i18n.js?v=20261112g";
  import { initCookieBanner } from "./js/cookies.js?v=20261112g";
  mountChrome();
  applyI18n();
  initLangSwitch();
  initCookieBanner();
</script>
<script type="module" src="js/admin.js?v=20261112g"></script>
</body>
</html>
