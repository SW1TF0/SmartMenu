<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — SmartMenuKJ</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#f1f0ee" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preload" href="fonts/handjet-dot.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="css/style.css" />
<script>(function(d){d.documentElement.classList.add("js");try{var t=localStorage.getItem("smkj_theme");if(t==="dark"||t==="light")d.documentElement.setAttribute("data-theme",t)}catch(e){}})(document);</script>
</head>
<body>

<a class="skip-link" href="#main" data-i18n="a11y.skip">Skip to content</a>
<header id="site-header" class="site-header" data-active="login.html" data-hide-mobile-cta></header>

<main id="main">
  <div class="auth-shell">
    <div class="auth-card">
      <p class="eyebrow" data-i18n="login.eyebrow">SmartMenuKJ account</p>
      <h1 class="auth-title" data-i18n="login.title">Track your requests.</h1>

      <div class="auth-tabs" role="tablist">
        <button type="button" class="active" role="tab" aria-selected="true" aria-controls="panelSignin" data-tab="signin" data-i18n="login.tab.signin">Sign in</button>
        <button type="button" role="tab" aria-selected="false" aria-controls="panelSignup" data-tab="signup" data-i18n="login.tab.signup">Create account</button>
      </div>

      <div id="panelSignin" class="tab-panel-auth" role="tabpanel">
        <button class="btn btn-google btn-block" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 36.4 27 37 24 37c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.6 40.5 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.6 5.4C41.8 36 45 30.4 45 24c0-1.2-.1-2.3-.4-3.5z"/></svg>
          <span data-i18n="login.google">Continue with Google</span>
        </button>
        <div class="auth-divider" data-i18n="login.or">or</div>
        <form id="signinForm">
          <div class="field">
            <label for="signinEmail" data-i18n="contact.form.email">Email</label>
            <input id="signinEmail" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="signinPassword" data-i18n="login.password">Password</label>
            <input id="signinPassword" type="password" required autocomplete="current-password" minlength="6" />
          </div>
          <button type="submit" class="btn btn-primary btn-block" data-i18n="login.signin.submit">Sign in</button>
          <p class="auth-foot"><button type="button" class="linklike" id="forgotLink" data-i18n="login.forgot">Forgot your password?</button></p>
          <div id="signinNote" class="form-note" role="status" aria-live="polite"></div>
        </form>
      </div>

      <div id="panelSignup" class="tab-panel-auth hidden" role="tabpanel">
        <button class="btn btn-google btn-block" type="button">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.6 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.2-.1-2.3-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.5 5.1 29.6 3 24 3 16.3 3 9.7 7.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.9 14.2-5.1l-6.6-5.4C29.6 36.4 27 37 24 37c-5.3 0-9.7-3.4-11.3-8.1l-6.5 5C9.6 40.5 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4.1 5.7l6.6 5.4C41.8 36 45 30.4 45 24c0-1.2-.1-2.3-.4-3.5z"/></svg>
          <span data-i18n="login.google">Continue with Google</span>
        </button>
        <div class="auth-divider" data-i18n="login.or">or</div>
        <form id="signupForm">
          <div class="field">
            <label for="signupName" data-i18n="contact.form.name">Full name</label>
            <input id="signupName" type="text" required autocomplete="name" />
          </div>
          <div class="field">
            <label for="signupEmail" data-i18n="contact.form.email">Email</label>
            <input id="signupEmail" type="email" required autocomplete="email" />
          </div>
          <div class="field">
            <label for="signupPassword" data-i18n="login.password">Password</label>
            <input id="signupPassword" type="password" required autocomplete="new-password" minlength="6" />
          </div>
          <button type="submit" class="btn btn-primary btn-block" data-i18n="login.signup.submit">Create account</button>
          <div id="signupNote" class="form-note" role="status" aria-live="polite"></div>
        </form>
      </div>
    </div>
  </div>
</main>

<footer id="site-footer" class="site-footer invert"></footer>

<script type="module">
  import { mountChrome } from "./js/chrome.js";
  import { registerDict, applyI18n, initLangSwitch } from "./js/i18n.js";
  import { initCookieBanner } from "./js/cookies.js";

  registerDict({
    en: {
      "login.eyebrow": "SmartMenuKJ account", "login.title": "Track your requests.",
      "login.tab.signin": "Sign in", "login.tab.signup": "Create account", "login.google": "Continue with Google", "login.or": "or",
      "login.password": "Password", "login.signin.submit": "Sign in", "login.forgot": "Forgot your password?", "login.signup.submit": "Create account",
    },
    bg: {
      "login.eyebrow": "Профил в SmartMenuKJ", "login.title": "Следете заявките си.",
      "login.tab.signin": "Вход", "login.tab.signup": "Регистрация", "login.google": "Продължи с Google", "login.or": "или",
      "login.password": "Парола", "login.signin.submit": "Вход", "login.forgot": "Забравена парола?", "login.signup.submit": "Регистрирай се",
    },
  });

  mountChrome();
  applyI18n();
  initLangSwitch();
  initCookieBanner();
</script>
<script type="module" src="js/login.js"></script>
</body>
</html>
