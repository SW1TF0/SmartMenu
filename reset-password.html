<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#05070d" />
  <title>Reset password — SmartMenuKJ</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" referrerpolicy="no-referrer" />
  <style>
    /* Self-contained styles — this page never depends on external CSS to look right */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root { --web: #38bdf8; --web2: #0ea5e9; --menu: #fb923c; --ok: #34d399; --err: #f87171; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      min-height: 100vh; font-family: 'Inter', system-ui, -apple-system, sans-serif;
      color: #e2e8f0; background: #05070d; position: relative; overflow-x: hidden;
      display: flex; flex-direction: column;
    }
    .rp-bg { position: fixed; inset: 0; z-index: 0; overflow: hidden;
      background:
        radial-gradient(60% 50% at 80% 0%, rgba(56,189,248,0.18), transparent 60%),
        radial-gradient(55% 50% at 10% 100%, rgba(251,146,60,0.14), transparent 60%),
        linear-gradient(180deg, #080b14, #05070d);
    }
    .rp-bg::before { content: ""; position: absolute; inset: 0;
      background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 60px 60px; mask-image: radial-gradient(100% 70% at 50% 0%, #000, transparent 80%);
      -webkit-mask-image: radial-gradient(100% 70% at 50% 0%, #000, transparent 80%);
    }
    .rp-top { position: relative; z-index: 2; display: flex; align-items: center; justify-content: space-between;
      max-width: 1100px; width: 100%; margin: 0 auto; padding: 1.1rem 1.3rem; }
    .rp-brand { display: flex; align-items: center; gap: 0.7rem; text-decoration: none; }
    .rp-mark { width: 38px; height: 38px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 1rem; color: #04121f; background: linear-gradient(135deg, var(--web), var(--menu)); box-shadow: 0 6px 20px -6px var(--web2); }
    .rp-name { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.15rem; color: #fff; letter-spacing: -0.01em; }
    .rp-name .b { color: var(--web); } .rp-name .o { color: var(--menu); }
    .rp-lang { display: inline-flex; align-items: center; gap: 5px; padding: 0.4rem 0.7rem; border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.03); color: #94a3b8;
      font-size: 0.78rem; font-weight: 600; cursor: pointer; }
    .rp-lang .o2 { transition: color .2s; } .rp-lang .on { color: var(--web); } .rp-lang .sep { color: #475569; }

    .rp-wrap { position: relative; z-index: 1; flex: 1; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .rp-card { width: 100%; max-width: 440px; padding: 2.4rem 2rem; text-align: center; border-radius: 24px;
      background: linear-gradient(160deg, rgba(20,28,46,0.75), rgba(8,11,20,0.85));
      border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 40px 90px -30px rgba(0,0,0,0.85), inset 0 1px 0 rgba(255,255,255,0.06);
      -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); animation: rp-in .6s cubic-bezier(.16,1,.3,1); }
    @keyframes rp-in { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
    .rp-icon { width: 60px; height: 60px; margin: 0 auto; border-radius: 17px; display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: #04121f; background: linear-gradient(135deg, var(--web), var(--web2)); box-shadow: 0 12px 30px -8px var(--web2); }
    .rp-h1 { font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 1.5rem; color: #fff; margin-top: 1.1rem; }
    .rp-sub { color: #94a3b8; font-size: 0.92rem; line-height: 1.55; margin: 0.5rem auto 1.7rem; max-width: 22rem; }

    .rp-field { text-align: left; margin-bottom: 1rem; }
    .rp-field label { display: block; font-size: 0.84rem; font-weight: 600; color: #cbd5e1; margin-bottom: 0.5rem; }
    .rp-input { position: relative; }
    .rp-input > i.lead { position: absolute; left: 0.95rem; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 0.9rem; pointer-events: none; }
    .rp-input input { width: 100%; height: 50px; padding: 0 2.9rem 0 2.6rem; border-radius: 13px; font-size: 0.98rem; color: #f1f5f9;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.13); transition: border-color .25s, box-shadow .25s, background .25s; outline: none; }
    .rp-input input::placeholder { color: #475569; }
    .rp-input input:focus { border-color: var(--web); background: rgba(255,255,255,0.06); box-shadow: 0 0 0 3px rgba(56,189,248,0.22); }
    .rp-eye { position: absolute; right: 0.55rem; top: 50%; transform: translateY(-50%); width: 34px; height: 34px; border-radius: 9px;
      border: none; background: transparent; color: #64748b; cursor: pointer; font-size: 0.95rem; }
    .rp-eye:hover { color: var(--web); }

    .rp-strength { display: flex; gap: 5px; margin: -0.2rem 0 0.4rem; }
    .rp-strength span { flex: 1; height: 4px; border-radius: 3px; background: rgba(255,255,255,0.1); transition: background .3s; }
    .rp-strength.s1 span:nth-child(1) { background: var(--err); }
    .rp-strength.s2 span:nth-child(-n+2) { background: var(--menu); }
    .rp-strength.s3 span:nth-child(-n+3) { background: var(--web); }
    .rp-strength.s4 span { background: var(--ok); }

    .rp-msg { display: none; align-items: center; gap: 0.55rem; text-align: left; font-size: 0.85rem; line-height: 1.45;
      padding: 0.75rem 0.9rem; border-radius: 12px; margin-bottom: 0.4rem; }
    .rp-msg.show { display: flex; }
    .rp-msg.err { color: #fca5a5; background: rgba(248,113,113,0.1); border: 1px solid rgba(248,113,113,0.32); }
    .rp-msg.info { color: #7dd3fc; background: rgba(56,189,248,0.1); border: 1px solid rgba(56,189,248,0.32); }
    .rp-msg i { flex-shrink: 0; }

    .rp-btn { width: 100%; height: 52px; margin-top: 0.6rem; border: none; cursor: pointer; border-radius: 14px;
      font-family: 'Inter', sans-serif; font-size: 1.02rem; font-weight: 700; color: #04121f; position: relative; overflow: hidden;
      background: linear-gradient(135deg, var(--web), var(--web2)); box-shadow: 0 14px 34px -12px var(--web2), inset 0 1px 0 rgba(255,255,255,0.35);
      transition: transform .2s, box-shadow .3s, opacity .2s; }
    .rp-btn:hover { transform: translateY(-2px); box-shadow: 0 20px 44px -12px var(--web2); }
    .rp-btn:active { transform: translateY(0) scale(.99); }
    .rp-btn:disabled { opacity: .7; cursor: default; transform: none; }
    .rp-btn::after { content: ""; position: absolute; top: 0; left: -120%; width: 55%; height: 100%;
      background: linear-gradient(100deg, transparent, rgba(255,255,255,0.45), transparent); transform: skewX(-18deg); transition: left .7s cubic-bezier(.16,1,.3,1); }
    .rp-btn:hover::after { left: 130%; }

    .rp-done { animation: rp-in .5s ease; }
    .rp-done .rp-icon { background: linear-gradient(135deg, var(--ok), #10b981); box-shadow: 0 12px 30px -8px #10b981; }
    .rp-done p { color: #cbd5e1; margin: 1rem auto 0; line-height: 1.6; max-width: 22rem; }
    .rp-done a { display: inline-flex; margin-top: 1.5rem; }

    .rp-back { display: inline-flex; align-items: center; gap: 0.4rem; margin-top: 1.5rem; color: #64748b; font-size: 0.85rem; text-decoration: none; transition: color .2s; }
    .rp-back:hover { color: var(--web); }
    .hidden { display: none !important; }
    @media (max-width: 480px) { .rp-card { padding: 2rem 1.4rem; } .rp-h1 { font-size: 1.3rem; } }
  </style>
</head>
<body>
  <div class="rp-bg" aria-hidden="true"></div>

  <header class="rp-top">
    <a class="rp-brand" href="index.html" aria-label="SmartMenuKJ home">
      <span class="rp-mark"><i class="fa-solid fa-bolt"></i></span>
      <span class="rp-name">Smart<span class="b">Menu</span><span class="o">KJ</span></span>
    </a>
    <button id="lang" class="rp-lang" type="button" aria-label="Switch language">
      <span class="o2 on" data-lang="en">EN</span><span class="sep">/</span><span class="o2" data-lang="bg">BG</span>
    </button>
  </header>

  <main class="rp-wrap">
    <div class="rp-card">
      <form id="reset-form" novalidate>
        <span class="rp-icon"><i class="fa-solid fa-key"></i></span>
        <h1 class="rp-h1" data-i18n data-en="Set a new password" data-bg="Задайте нова парола">Set a new password</h1>
        <p class="rp-sub" data-i18n data-en="Choose a new password for your SmartMenuKJ account." data-bg="Изберете нова парола за вашия акаунт в SmartMenuKJ.">Choose a new password for your SmartMenuKJ account.</p>

        <div class="rp-field">
          <label data-i18n data-en="New password" data-bg="Нова парола">New password</label>
          <div class="rp-input">
            <i class="fa-solid fa-lock lead"></i>
            <input type="password" id="rp-pass" autocomplete="new-password" minlength="6" placeholder="••••••••" />
            <button type="button" class="rp-eye" data-eye aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>
        <div class="rp-strength" id="rp-strength"><span></span><span></span><span></span><span></span></div>

        <div class="rp-field">
          <label data-i18n data-en="Confirm new password" data-bg="Потвърдете новата парола">Confirm new password</label>
          <div class="rp-input">
            <i class="fa-solid fa-lock lead"></i>
            <input type="password" id="rp-confirm" autocomplete="new-password" minlength="6" placeholder="••••••••" />
            <button type="button" class="rp-eye" data-eye aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
          </div>
        </div>

        <p class="rp-msg" id="rp-msg"><i class="fa-solid fa-circle-exclamation"></i> <span></span></p>
        <button type="submit" class="rp-btn" id="rp-submit" data-i18n data-en="Update password" data-bg="Обнови паролата">Update password</button>
      </form>

      <div class="rp-done hidden" id="rp-done">
        <span class="rp-icon"><i class="fa-solid fa-circle-check"></i></span>
        <h1 class="rp-h1" data-i18n data-en="Password updated" data-bg="Паролата е обновена">Password updated</h1>
        <p data-i18n data-en="Your password has been changed successfully. You can now sign in with your new password." data-bg="Паролата ви е сменена успешно. Вече можете да влезете с новата парола.">Your password has been changed successfully. You can now sign in with your new password.</p>
        <a class="rp-btn" style="text-decoration:none;display:inline-flex;align-items:center;justify-content:center;padding:0 1.6rem;width:auto;height:48px;" href="index.html" data-i18n data-en="Go to sign in" data-bg="Към вход">Go to sign in</a>
      </div>

      <a class="rp-back" href="index.html"><i class="fa-solid fa-arrow-left"></i> <span data-i18n data-en="Back to site" data-bg="Към сайта">Back to site</span></a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    (function () {
      var CFG = window.SMKJ_CONFIG || {};
      var norm = function (u) { return String(u || '').trim().replace(/\/+$/, '').replace(/\/(rest|auth)\/v1$/i, '').replace(/\/+$/, ''); };
      var sb = null;
      if (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase && window.supabase.createClient) {
        try { sb = window.supabase.createClient(norm(CFG.SUPABASE_URL), CFG.SUPABASE_ANON_KEY); } catch (e) {}
      }

      /* bilingual */
      var lang = localStorage.getItem('smkj-lang') || 'en';
      function applyLang() {
        document.documentElement.lang = lang;
        document.querySelectorAll('[data-i18n]').forEach(function (el) { var v = el.getAttribute('data-' + lang); if (v !== null) el.textContent = v; });
        document.querySelectorAll('.rp-lang .o2').forEach(function (o) { o.classList.toggle('on', o.getAttribute('data-lang') === lang); });
      }
      document.getElementById('lang').addEventListener('click', function () { lang = (lang === 'en' ? 'bg' : 'en'); localStorage.setItem('smkj-lang', lang); applyLang(); });
      document.querySelectorAll('.rp-lang .o2').forEach(function (o) { o.addEventListener('click', function (e) { e.stopPropagation(); lang = o.getAttribute('data-lang'); localStorage.setItem('smkj-lang', lang); applyLang(); }); });
      applyLang();

      /* show / hide password */
      document.querySelectorAll('[data-eye]').forEach(function (btn) {
        btn.addEventListener('click', function () {
          var input = btn.parentElement.querySelector('input'); var icon = btn.querySelector('i');
          if (input.type === 'password') { input.type = 'text'; if (icon) icon.className = 'fa-solid fa-eye-slash'; }
          else { input.type = 'password'; if (icon) icon.className = 'fa-solid fa-eye'; }
        });
      });

      /* strength meter */
      var passEl = document.getElementById('rp-pass'), strengthEl = document.getElementById('rp-strength');
      passEl.addEventListener('input', function () {
        var v = passEl.value, s = 0;
        if (v.length >= 6) s++;
        if (v.length >= 10) s++;
        if (/[0-9]/.test(v) && /[a-zA-Z]/.test(v)) s++;
        if (/[^a-zA-Z0-9]/.test(v)) s++;
        strengthEl.className = 'rp-strength' + (v ? ' s' + Math.max(1, Math.min(4, s)) : '');
      });

      /* messages */
      var msgEl = document.getElementById('rp-msg'), msgText = msgEl.querySelector('span');
      function msg(text, kind) { msgText.textContent = text; msgEl.className = 'rp-msg show ' + (kind || 'err'); }
      function clearMsg() { msgEl.className = 'rp-msg'; }
      var T = {
        nosb: { en: 'Password reset is unavailable here. Please contact krasimiruzun@smartmenukj.com.', bg: 'Нулирането не е достъпно тук. Пишете на krasimiruzun@smartmenukj.com.' },
        short: { en: 'Password must be at least 6 characters.', bg: 'Паролата трябва да е поне 6 символа.' },
        mismatch: { en: 'The two passwords do not match.', bg: 'Двете пароли не съвпадат.' },
        expired: { en: 'This reset link is invalid or has expired. Please request a new one from the sign-in window.', bg: 'Връзката е невалидна или изтекла. Заявете нова от прозореца за вход.' }
      };
      var tr = function (k) { return T[k][lang] || T[k].en; };

      if (sb) { sb.auth.onAuthStateChange(function () {}); }

      document.getElementById('reset-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        clearMsg();
        if (!sb) { msg(tr('nosb'), 'info'); return; }
        var pass = passEl.value, confirm = document.getElementById('rp-confirm').value;
        if (pass.length < 6) { msg(tr('short'), 'err'); return; }
        if (pass !== confirm) { msg(tr('mismatch'), 'err'); return; }
        var btn = document.getElementById('rp-submit'); btn.disabled = true;
        try {
          var r = await sb.auth.updateUser({ password: pass });
          if (r.error) { msg(tr('expired'), 'err'); return; }
          document.getElementById('reset-form').classList.add('hidden');
          document.getElementById('rp-done').classList.remove('hidden');
          applyLang();
        } catch (err) { msg(tr('expired'), 'err'); }
        finally { btn.disabled = false; }
      });
    })();
  </script>
</body>
</html>
