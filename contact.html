<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Contact — SmartMenuKJ</title>
<meta name="description" content="Get a free quote from SmartMenuKJ for web development, 3D printing, smart home & business automation, camera systems, digital menus, or PC/printer service in Kardzhali, Bulgaria." />
<link rel="canonical" href="https://www.smartmenukj.com/contact.html" />
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<style>
  .contact-grid { display: grid; grid-template-columns: 1fr 1.2fr; gap: 40px; align-items: start; }
  @media (max-width: 900px) { .contact-grid { grid-template-columns: 1fr; } }
  .info-row { display: flex; gap: 14px; align-items: flex-start; margin-bottom: 22px; }
  .info-row .ic { width: 40px; height: 40px; border-radius: 10px; background: rgba(45,212,200,.1); color: var(--accent); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .info-row .ic svg { width: 19px; height: 19px; }
</style>
</head>
<body>

<header id="site-header" data-active="contact.html" data-hide-mobile-cta></header>

<main>
  <section class="page-hero">
    <div class="container">
      <div class="crumbs"><a href="index.html" data-i18n="nav.home">Home</a> / <span data-i18n="nav.contact">Contact</span></div>
      <div class="eyebrow center" data-i18n="contact.eyebrow">Get in touch</div>
      <h1 class="h-lg" data-i18n="contact.title">Tell us what you need — we'll quote it fast.</h1>
      <p class="lede center" data-i18n="contact.lede">Most quotes go out within 24 hours. No obligation.</p>
    </div>
  </section>

  <section class="section" id="quote">
    <div class="container contact-grid">
      <div class="reveal">
        <h3 data-i18n="contact.info.title">Reach us directly</h3>
        <div class="info-row">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1.9.3 1.8.6 2.7a2 2 0 01-.4 2.1L8.1 9.7a16 16 0 006.2 6.2l1.2-1.2a2 2 0 012.1-.4c.9.3 1.8.5 2.7.6a2 2 0 011.7 2z"/></svg></div>
          <div><strong data-i18n="contact.phone.label">Phone</strong><br /><a href="tel:+359885348666">+359 88 534 8666</a></div>
        </div>
        <div class="info-row">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M4 6l8 7 8-7"/></svg></div>
          <div><strong data-i18n="contact.email.label">Email</strong><br /><a href="mailto:krasimiruzun@smartmenukj.com">krasimiruzun@smartmenukj.com</a></div>
        </div>
        <div class="info-row">
          <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 10-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg></div>
          <div><strong data-i18n="contact.addr.label">Address</strong><br />ul. „Dzhebelska&rdquo; 2, 6600 Baykal, <span data-i18n="contact.addr.city">Kardzhali, Bulgaria</span></div>
        </div>
        <div class="social-row" style="margin-top:10px;">
          <a href="https://www.instagram.com/1337_krasimir_/" target="_blank" rel="noopener" aria-label="Instagram"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.2c3.2 0 3.6 0 4.85.07 3.25.15 4.77 1.69 4.92 4.92.06 1.25.07 1.63.07 4.81 0 3.19-.01 3.56-.07 4.81-.15 3.23-1.66 4.77-4.92 4.92-1.25.06-1.62.07-4.85.07-3.2 0-3.58-.01-4.83-.07-3.26-.15-4.77-1.7-4.92-4.92-.06-1.25-.07-1.62-.07-4.81 0-3.18.02-3.56.07-4.81.15-3.23 1.67-4.77 4.92-4.92C8.42 2.21 8.8 2.2 12 2.2zm0 1.8c-3.14 0-3.5 0-4.74.07-2.32.1-3.4 1.2-3.5 3.5-.06 1.24-.07 1.6-.07 4.74s.01 3.5.07 4.74c.1 2.3 1.18 3.4 3.5 3.5 1.24.06 1.6.07 4.74.07s3.5-.01 4.74-.07c2.31-.1 3.4-1.19 3.5-3.5.06-1.24.07-1.6.07-4.74s-.01-3.5-.07-4.74c-.1-2.3-1.19-3.4-3.5-3.5C15.5 4 15.14 4 12 4zm0 3.35a4.8 4.8 0 110 9.6 4.8 4.8 0 010-9.6zm0 1.8a3 3 0 100 6 3 3 0 000-6zm5-2a1.12 1.12 0 110 2.25A1.12 1.12 0 0117 7.15z"/></svg></a>
          <a href="https://www.linkedin.com/in/krasimir-uzun-316a053bb/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.94 8.5H3.56V20.4h3.38V8.5zM5.25 3.6a1.96 1.96 0 100 3.92 1.96 1.96 0 000-3.92zM20.44 20.4h-3.37v-6.1c0-1.45-.03-3.32-2.02-3.32-2.03 0-2.34 1.58-2.34 3.22v6.2H9.34V8.5h3.24v1.63h.05c.45-.86 1.56-1.78 3.22-1.78 3.44 0 4.07 2.27 4.07 5.21v6.84z"/></svg></a>
        </div>
      </div>

      <div class="card reveal">
        <h3 data-i18n="contact.form.title" style="margin-bottom:20px;">Request a quote</h3>
        <form id="quoteForm">
          <div class="field-row">
            <div class="field">
              <label for="fName" data-i18n="contact.form.name">Full name</label>
              <input id="fName" name="name" type="text" required autocomplete="name" />
            </div>
            <div class="field">
              <label for="fEmail" data-i18n="contact.form.email">Email</label>
              <input id="fEmail" name="email" type="email" required autocomplete="email" />
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="fPhone" data-i18n="contact.form.phone">Phone (optional)</label>
              <input id="fPhone" name="phone" type="tel" autocomplete="tel" />
            </div>
            <div class="field">
              <label for="serviceSelect" data-i18n="contact.form.service">Which service?</label>
              <select id="serviceSelect" name="service">
                <option value="general" data-i18n="contact.form.svc.general">General inquiry</option>
                <option value="web" data-i18n="svc.web">Web Development</option>
                <option value="print3d" data-i18n="svc.print3d">3D Printing</option>
                <option value="smarthome" data-i18n="svc.smarthome">Smart Home &amp; Business</option>
                <option value="cameras" data-i18n="svc.cameras">Camera &amp; Security Systems</option>
                <option value="menu" data-i18n="svc.menu">Digital Smart Menus</option>
                <option value="pc" data-i18n="svc.pc">PC &amp; Printer Service</option>
              </select>
            </div>
          </div>
          <div class="field">
            <label for="fMsg" data-i18n="contact.form.message">Tell us about your project</label>
            <textarea id="fMsg" name="message" required></textarea>
          </div>
          <button type="submit" class="btn btn-primary btn-block" data-i18n="contact.form.submit">Send request</button>
          <div id="quoteNote" class="form-note"></div>
        </form>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script type="module">
  import { mountChrome } from "./js/chrome.js";
  import { registerDict, applyI18n, initLangSwitch } from "./js/i18n.js";

  import { initReveal } from "./js/site.js";

  registerDict({
    en: {
      "contact.eyebrow": "Get in touch", "contact.title": "Tell us what you need — we'll quote it fast.",
      "contact.lede": "Most quotes go out within 24 hours. No obligation.",
      "contact.info.title": "Reach us directly", "contact.phone.label": "Phone", "contact.email.label": "Email",
      "contact.addr.label": "Address", "contact.addr.city": "Kardzhali, Bulgaria",
      "contact.form.title": "Request a quote", "contact.form.name": "Full name", "contact.form.email": "Email",
      "contact.form.phone": "Phone (optional)", "contact.form.service": "Which service?", "contact.form.svc.general": "General inquiry",
      "contact.form.message": "Tell us about your project", "contact.form.submit": "Send request",
    },
    bg: {
      "contact.eyebrow": "Свържете се с нас", "contact.title": "Кажете ни какво ви трябва — ще отговорим бързо.",
      "contact.lede": "Повечето оферти излизат до 24 часа. Без ангажимент.",
      "contact.info.title": "Свържете се директно", "contact.phone.label": "Телефон", "contact.email.label": "Имейл",
      "contact.addr.label": "Адрес", "contact.addr.city": "Кърджали, България",
      "contact.form.title": "Поискайте оферта", "contact.form.name": "Име", "contact.form.email": "Имейл",
      "contact.form.phone": "Телефон (по избор)", "contact.form.service": "Коя услуга?", "contact.form.svc.general": "Обща запитване",
      "contact.form.message": "Разкажете ни за проекта", "contact.form.submit": "Изпрати запитване",
    },
  });

  mountChrome();
  applyI18n();
  initLangSwitch();
  initCookieBanner();
  initReveal();
</script>
<script type="module" src="js/contact-page.js"></script>
</body>
</html>
